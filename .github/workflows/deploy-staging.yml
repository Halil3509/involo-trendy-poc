name: Deploy Staging

on:
  push:
    branches: [main]
    paths-ignore:
      - 'frontend/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: eu-west-3
  ECR_REPO: involo-trendy-poc/backend
  IMAGE_URI: 013049518751.dkr.ecr.eu-west-3.amazonaws.com/involo-trendy-poc/backend
  EC2_INSTANCE_ID: i-0154019e4120737bb

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::013049518751:role/github-actions-trendy-poc-staging-image-pusher
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        run: |
          SHA=${{ github.sha }}
          SHORT_SHA=$(printf '%.7s' "$SHA")
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: INSTALL_PLAYWRIGHT=true
          push: true
          tags: |
            ${{ env.IMAGE_URI }}:${{ github.sha }}
            ${{ env.IMAGE_URI }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_URI }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::013049518751:role/github-actions-trendy-poc-staging-deployer
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy involo-trendy-poc backend to staging" \
            --parameters "commands=cd /home/ubuntu/involo-trendy-poc && ./scripts/deploy-backend-staging.sh ${{ needs.build-and-push.outputs.image_sha }}" \
            --cloud-watch-output-config "CloudWatchOutputEnabled=true" \
            --query CommandId --output text)
          echo "SSM CommandId: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query Status --output text)
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) exit 1 ;;
              *) sleep 2 ;;
            esac
          done
          echo "SSM command did not finish in time"
          exit 1
