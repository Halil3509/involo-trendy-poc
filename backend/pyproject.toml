[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "involo-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "argon2-cffi>=23.1",
  "boto3>=1.35",
  "celery[redis]>=5.4",
  "croniter>=3.0",
  "cryptography",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.27",
  "markdown>=3.10.2",
  "numpy>=2.1",
  "playwright>=1.49",
  "pydantic-settings>=2.7",
  "pyjwt>=2.10",
  "pymongo>=4.10",
  "qdrant-client>=1.12",
  "redis>=5.2",
  "scikit-learn>=1.5",
  "uvicorn[standard]>=0.34",
  "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "real_instagram: opt-in real Instagram smoke tests",
  "real_aws: opt-in real AWS (Transcribe/Bedrock) tests",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "croniter", "boto3", "sklearn", "sklearn.*", "yt_dlp", "yt_dlp.*", "markdown"]
ignore_missing_imports = true
