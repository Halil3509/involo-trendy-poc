services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    command: mongod --port 8022
    ports:
      - "8022:8022"
    environment:
      # Workaround for MongoDB 8 + Linux 6.19 TCMalloc/RSEQ SIGSEGV.
      # See https://github.com/docker-library/mongo/issues/747
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'timeout 2 echo > /dev/tcp/127.0.0.1/8022'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --port 8028
    ports:
      - "8028:8028"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "8028", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "8024:8024"
      - "8025:8025"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 8024
      QDRANT__SERVICE__GRPC_PORT: 8025
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8024'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mongodb_data:
  redis_data:
  qdrant_data:
