services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    command: mongod --port 8022
    ports:
      - "8022:8022"
    environment:
      # Workaround for MongoDB 8 + Linux 6.19 TCMalloc/RSEQ SIGSEGV.
      # See https://github.com/docker-library/mongo/issues/747
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'timeout 2 echo > /dev/tcp/127.0.0.1/8022'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --port 8028
    ports:
      - "8028:8028"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "8028", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "8024:8024"
      - "8025:8025"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 8024
      QDRANT__SERVICE__GRPC_PORT: 8025
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8024'"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --address ":8026" --console-address ":8027"
    environment:
      MINIO_ROOT_USER: ${INVOLO_TRANSCRIBE_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${INVOLO_TRANSCRIBE_S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "8026:8026"
      - "8027:8027"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8026/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${INVOLO_TRANSCRIBE_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${INVOLO_TRANSCRIBE_S3_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_BUCKET: ${INVOLO_TRANSCRIBE_S3_BUCKET:-involo-transcribe}
      MINIO_MEDIA_BUCKET: ${INVOLO_MEDIA_S3_BUCKET:-involo-media}
      MINIO_EMBEDDING_MEDIA_BUCKET: ${INVOLO_EMBEDDING_MEDIA_S3_BUCKET:-involo-media}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:8026 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing "local/$$MINIO_BUCKET"
        && mc mb --ignore-existing "local/$$MINIO_MEDIA_BUCKET"
        && mc mb --ignore-existing "local/$$MINIO_EMBEDDING_MEDIA_BUCKET"

volumes:
  mongodb_data:
  redis_data:
  qdrant_data:
  minio_data:
